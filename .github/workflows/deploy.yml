name: Build and Deploy
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    concurrency: ci-${{ github.ref }} # Recommended if you intend to make multiple deployments in quick succession.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install and Build 🔧 # This example project is built using npm and outputs the result to the 'build' folder. Replace with the commands required to build your project, or remove this step entirely if your site is pre-built.
        env:
          VITE_CAREER_API_URL: https://9rbrdyq2o2.execute-api.eu-west-2.amazonaws.com
          VITE_COGNITO_DOMAIN: https://behrad-career-agent-prod-635863384208.auth.eu-west-2.amazoncognito.com
          VITE_COGNITO_CLIENT_ID: 5hgk0avac11s3juuiatgn6gm8d
          VITE_COGNITO_REDIRECT_URI: https://behradzabihi.app/career
          VITE_RUM_APP_MONITOR_ID: def24883-db89-460c-bb7f-36e4fd394c55
          VITE_RUM_REGION: eu-west-2
        run: |
          yarn install --immutable --immutable-cache --check-cache
          yarn build
          touch build/.nojekyll
          cp build/404.html build/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v4
